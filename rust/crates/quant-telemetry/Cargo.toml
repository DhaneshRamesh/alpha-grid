[package]
name = "quant-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
quant-core.workspace = true
quant-market-data.workspace = true
quant-engine = { path = "../quant-engine" }
quant-journal.workspace = true
quant-replay.workspace = true
quant-paper.workspace = true
axum.workspace = true
arc-swap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs", "io-util"] }
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"

[dev-dependencies]
tempfile = "3.23"
