[workspace]
resolver = "2"
members = [
  "crates/quant-core",
  "crates/quant-market-data",
  "crates/quant-orderbook",
  "crates/quant-journal",
  "crates/quant-replay",
  "crates/quant-bench",
  "crates/quant-depth",
  "crates/quant-engine",
  "crates/quant-telemetry",
  "crates/quant-paper",
  "crates/quant-inference",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
quant-core = { path = "crates/quant-core" }
quant-market-data = { path = "crates/quant-market-data" }
quant-orderbook = { path = "crates/quant-orderbook" }
quant-journal = { path = "crates/quant-journal" }
quant-replay = { path = "crates/quant-replay" }
quant-paper = { path = "crates/quant-paper" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] }
crc32fast = "1.5"
libc = "0.2"
axum = { version = "=0.8.9", features = ["ws", "json"] }
arc-swap = "=1.9.2"
schemars = "=1.2.3"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
