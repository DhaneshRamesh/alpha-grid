name: Validate data and paper research foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check macOS offline launcher syntax
        run: bash -n tools/start-cockpit-macos.sh
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-py312-rust-${{ hashFiles('uv.lock', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-py312-rust-
      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.10.8
          uv sync --extra dev --locked --python python3.12
      - name: Python tests and static checks
        run: |
          umask 077
          mkdir -p data/.secrets
          uv run --locked --extra dev python -m pytest -q
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .
          uv run --locked --extra dev mypy
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Rust tests and static checks
        run: |
          cargo test --locked --workspace --all-targets --manifest-path rust/Cargo.toml
          cargo fmt --all --manifest-path rust/Cargo.toml -- --check
          cargo clippy --locked --workspace --all-targets --manifest-path rust/Cargo.toml -- -D warnings
          cargo build --locked --workspace --release --manifest-path rust/Cargo.toml
          cargo check --locked -p quant-depth --features live-readonly --manifest-path rust/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests and schema compatibility
        run: |
          npm ci --prefix web
          cargo run --locked -q -p quant-telemetry --bin schema_export --manifest-path rust/Cargo.toml -- web/schemas
          npm run schema:generate --prefix web
          git diff --exit-code -- web/schemas web/src/generated
          npm run typecheck --prefix web
          npm run lint --prefix web
          npm run format:check --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: macOS offline startup smoke
        if: matrix.os == 'macos-15'
        run: |
          bash tools/start-cockpit-macos.sh --no-browser &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true; wait "$launcher" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:5173/ >/dev/null &&
               curl --silent --fail http://127.0.0.1:8765/api/health >/dev/null &&
               curl --silent --fail http://127.0.0.1:8767/trade/status >/dev/null; then
              ready=1
              break
            fi
            kill -0 "$launcher"
            sleep 0.25
          done
          test "$ready" -eq 1
          private="$HOME/Library/Application Support/AlphaGrid/offline-dev"
          test "$(stat -f %Lp "$private")" = 700
          test "$(stat -f %Lp "$private/paper-approvals.qp")" = 600
