[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-grid"
version = "0.4.0"
description = "NSE market-data foundation with Dhan depth, journal, and research Parquet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "pyarrow>=18,<26", "polars>=1,<2"]
research = ["pyarrow>=18,<26"]
dhan = ["dhanhq>=2.3,<2.4", "websockets>=14,<18"]

[project.scripts]
quant-diagnostics = "quant.apps.diagnostics:main"
quant-collect-depth = "quant.apps.collect_depth:main"
quant-export-parquet = "quant.apps.export_parquet:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["quant"]

[[tool.mypy.overrides]]
module = ["dhanhq", "dhanhq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
